schema_version: "1.1"
name: new-system-initial-architecture
expected_outcome: |
  新規構想として、正式な報告書（本文と付録、MarkdownとHTML、台帳）を作る。本文の冒頭で部長が決めること・暫定推奨・最大の不利益を示す。「システム化」を目的とせず、何が良くなるかを目標として仮置きし、測定指標と現状値の取得方法を示す。インパクトマップで目標から行動変化と手段をつなぎ、既製品や運用変更だけの案を自社開発と並べて比べる。自社開発では論理境界と配置方式を分け、3人体制に合う小さな構成から始める理由を述べる。最初の試行を、上限・成功と反証の条件・停止条件付きで示す。数値を創作しない。専門用語は初出で説明する。
