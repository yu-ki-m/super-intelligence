<!DOCTYPE html>
<!--
  見本のプロトタイプ（縦のタブレット）：C-01「点検の順路を 1 画面に並べ、判断の基準をその項目の中に出し、異常だけを写真と所見つきで保全に送る」
  - 反復：iter-01（架空の案件「工場の設備の日常点検を、紙の点検表からタブレットに移す」）
  - 検証する仮説：H-01 前回の値と基準を並べる、H-02 判断の基準を項目の中に出す、H-03 異常をその場で保全に送る、H-04 中断しても順路の位置を残す
  - 模擬している部分：点検の記録は JavaScript の状態だけ。写真は枠だけ。保全の受け取りは状態の切替えで模擬
  - 未実装：音の見本の再生、写真の撮影、点検表の印刷（画面に「未実装」と表示）
  - デザインシステム：既定の DS（sample-design-system-mobile。指で押す部品のため）、見た目はミニマル。
    端末の枠（device.css / device.js）は、.dv-phone の data-device="tablet"でタブレット（800 × 1280）にする。DS 外の部品：なし
  - デモ：demo-bridge.js を読み込み、window.uxDemoApply で台本の状態を受け取る。デモの中では検証用の操作盤を隠す
  - データ：実在の会社・設備・人物を使わない（references/prototype.md の「データ」）
-->

  .p-gauge { position: relative; height: 10px; border-radius: 5px; background: var(--ds-color-bg-muted); }

  .p-gauge__mark { position: absolute; top: -6px; width: 4px; height: 22px; margin-left: -2px; border-radius: 2px; background: var(--ds-color-text-body); }
  .p-gauge__prev { position: absolute; top: -4px; width: 2px; height: 18px; margin-left: -1px; background: var(--ds-color-text-description); }
  .p-gauge-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--ds-color-text-secondary); margin-top: 8px; }
  .p-criteria { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--ds-color-bg-subtle); font-size: var(--ds-font-size-body-m); line-height: 1.7; }
  .p-criteria b { display: block; margin-bottom: 2px; }
  .p-unimpl { display: inline-flex; padding: 0 6px; border: 1px dashed var(--ds-color-border-input); border-radius: 4px; color: var(--ds-color-text-secondary); font-size: 12px; }
  .p-photo { display: grid; place-items: center; gap: 4px; height: 150px; border: 1px dashed var(--ds-color-border-input); border-radius: 12px; color: var(--ds-color-text-secondary); font-size: var(--ds-font-size-body-s); }
  .p-photo.is-taken { border-style: solid; background: linear-gradient(135deg, var(--ds-color-bg-muted), var(--ds-color-bg-subtle)); color: var(--ds-color-text-body); }
  /* 異常を記録するシート：タブレットの幅と高さを使う。左に所見の大きな選択肢とメモ、右に大きな写真の枠 */
  .p-sheet-wide { left: 24px; right: 24px; max-height: 62%; border-radius: 28px 28px 0 0; }
  .p-sheet-wide .ds-sheet__header { padding-top: 4px; }
  .p-ab-context { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 4px; font-size: var(--ds-font-size-body-s); color: var(--ds-color-text-secondary); font-weight: var(--ds-font-weight-normal); }
  .p-ab-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  .p-ab-label { margin: 0 0 8px; font-size: var(--ds-font-size-body-s); font-weight: var(--ds-font-weight-bold); color: var(--ds-color-text-secondary); }
  .p-find { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .p-find button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 0 16px; border: 1px solid var(--ds-color-border-input); border-radius: 14px; background: var(--ds-color-bg-container); color: var(--ds-color-text-body); font: inherit; font-size: 17px; text-align: left; cursor: pointer; }
  .p-find__box { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border: 2px solid var(--ds-color-border-input); border-radius: 6px; color: transparent; }
  .p-find__box .ds-icon { width: 16px; height: 16px; }
  .p-find button[aria-pressed="true"] { border-color: var(--ds-color-border-selected); box-shadow: inset 0 0 0 1px var(--ds-color-border-selected); font-weight: var(--ds-font-weight-bold); }
  .p-find button[aria-pressed="true"] .p-find__box { border-color: var(--ds-color-border-selected); background: var(--ds-color-border-selected); color: #fff; }
  .p-ab-grid .p-photo { height: 240px; }
  .p-ab-grid .ds-textarea { min-height: 72px; margin-top: 12px; }
</style>

  <symbol id="ds-i-image" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><circle cx="5.5" cy="6" r="1.2"/><path d="M14.5 11l-4-4-6 6.5"/></symbol>
  <symbol id="dv-i-nav-back" viewBox="0 0 16 16"><path d="M11.5 2.5v11L3 8z"/></symbol>
  <symbol id="dv-i-nav-home" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/></symbol>
  <symbol id="dv-i-nav-recents" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5"/></symbol>
  <symbol id="dv-i-wifi" viewBox="0 0 16 16"><path fill="currentColor" stroke="none" d="M8 13.8L.4 5.3A11 11 0 0 1 8 2.2a11 11 0 0 1 7.6 3.1z"/></symbol>
  <symbol id="dv-i-signal" viewBox="0 0 16 16"><path fill="currentColor" stroke="none" d="M14.5 1.5v13h-13z"/></symbol>
</svg>

<div class="dv-stage">
  <div class="dv-phone" data-device="tablet" data-frame="silver" data-frame-fixed data-nav="buttons" data-nav-fixed data-app-name="設備点検" data-app-icon="点" data-battery="82" data-time="8:30" id="phone">
    <div class="dv-phone__glass">
      <div class="dv-screen">
        <div class="dv-viewport">
          <div class="ds-app" id="app"></div>
        </div>
      </div>
    </div>
  </div>

  <aside class="dv-controls" aria-label="検証用の操作盤（製品の一部ではない）">
    <h2 class="dv-controls__title">検証用</h2>
    <div class="dv-controls__group">
      <span class="dv-controls__label">シナリオ</span>
      <div class="ds-segmented" role="group" aria-label="シナリオ" id="scn">
        <button type="button" data-scn="normal" aria-pressed="true">通常 12 設備</button>
        <button type="button" data-scn="large" aria-pressed="false">大量 60 設備</button>
      </div>
    </div>
    <div class="dv-controls__group">
      <span class="dv-controls__label">出来事を起こす</span>
      <div class="ds-btn-stack">
        <button type="button" class="ds-btn" data-ev="resume">中断から戻る</button>
        <button type="button" class="ds-btn" data-ev="accept">保全が受け取る</button>
      </div>
    </div>
  </aside>
</div>

<script>
(function () {
  'use strict';
  /* ---------- データ（架空） ---------- */
  const BASE = [
    { id: 'P-01', name: '原料ポンプ' }, { id: 'P-02', name: '補給水ポンプ' }, { id: 'P-03', name: '冷却水ポンプ', place: '第2ライン 東側・床下ピット' },
    { id: 'C-01', name: '冷却塔ファン' }, { id: 'C-02', name: '冷却塔 散水', noPrev: true },
    { id: 'M-01', name: '第1ミキサー' }, { id: 'M-02', name: '第2ミキサー（2024 年更新・インバーター制御。点検は停止中だけ可）' },
    { id: 'H-01', name: '温水ヒーター' }, { id: 'F-01', name: '排気ファン' }, { id: 'F-02', name: '局所排気' },
    { id: 'A-01', name: 'エアコンプレッサー' }, { id: 'A-02', name: 'エアドライヤー' }
  ];
  const ITEMS = [
    { id: 'pressure', title: '吐出圧', kind: 'num', unit: 'MPa', min: 0.40, max: 0.50, prev: 0.45 },
    { id: 'sound', title: '異音', kind: 'judge', criteria: '金属がこすれる音・周期的な打音は「異常」。モーターの一定のうなり音だけなら「正常」。いつもと違うが判断できないときは「要注意」にして写真を残す。' },
    { id: 'leak', title: '漏れ（継手・パッキン）', kind: 'judge', criteria: '床に水たまりがある、滴が続けて落ちるなら「異常」。にじみだけなら「要注意」。' },
    { id: 'vib', title: '振動', kind: 'judge', criteria: '手を当てて、前回より明らかに大きいなら「要注意」。ボルトの緩みがあれば「異常」。' }
  ];
  const JUDGE = [['ok', '正常'], ['warn', '要注意'], ['ng', '異常']];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const icon = n => `<svg class="ds-icon" aria-hidden="true"><use href="#ds-i-${n}"/></svg>`;
  function equipments() {
    if (S.scn !== 'large') return BASE;
    const out = BASE.slice();
    for (let i = 0; i < 48; i++) out.push({ id: 'X-' + String(i + 1).padStart(2, '0'), name: '付帯設備 ' + (i + 1) });
    return out;
  }

  /* ---------- 状態 ---------- */
  const DEFAULT = { scn: 'normal', time: '8:30', screen: 'route', eq: 2, pressure: '', sound: null, leak: null, vib: null, open: null, sheet: null, finding: false, picked: '', note: '', photo: false, sent: false, resumed: false, accepted: false };
  let S = Object.assign({}, DEFAULT);
  const app = document.getElementById('app');

  function render() {
    const focused = document.activeElement;
    if (focused && app.contains(focused)) focused.blur();   // 入力欄に焦点があるまま描き直すと、端末のキーボードが残るため
    document.getElementById('phone').dataset.time = S.time;
    const t = document.querySelector('.dv-time'); if (t) t.textContent = S.time;
    app.innerHTML = `<div class="ds-app__stack">${S.screen === 'done' ? doneScreen() : routeScreen()}</div>${S.sheet === 'abnormal' ? abnormalSheet() : ''}`;
    document.querySelectorAll('#scn [data-scn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.scn === S.scn)));
  }

  function routeBar(list) {
    return `<nav class="p-route" id="route" aria-label="点検の順路">${list.map((e, i) => {
      const done = i < S.eq, cur = i === S.eq;
      const st = done ? (e.id === 'P-03' && S.sent ? `<span class="ds-status ds-status--error">${icon('error')}異常 1</span>` : `<span class="ds-status ds-status--success">${icon('success')}済み</span>`)
        : cur ? `<span class="ds-status ds-status--info">${icon('clock')}点検中</span>` : `<span class="ds-status ds-status--pending">${icon('pending')}まだ</span>`;
      return `<div class="p-stop"${cur ? ' aria-current="step"' : ''}><b>${e.id}</b>${st}</div>`;
    }).join('')}</nav>`;
  }

  function itemHtml(it) {
    if (it.kind === 'num') {
      const v = parseFloat(S.pressure);
      const pos = x => Math.max(0, Math.min(100, 20 + (x - it.min) / (it.max - it.min) * 60));
      return `<section class="p-item" id="check-${it.id}">
        <div class="p-item__head"><h2>${it.title}</h2><span>基準 ${it.min.toFixed(2)}〜${it.max.toFixed(2)} ${it.unit} ・ 前回 ${it.prev.toFixed(2)}（昨日 8:41 宮下）</span></div>
        <div class="p-num"><input class="ds-input" inputmode="decimal" aria-label="${it.title}（${it.unit}）" value="${esc(S.pressure)}" placeholder="0.00" data-act="pressure">
          <div><div class="p-gauge" aria-hidden="true"><div class="p-gauge__ok"></div><div class="p-gauge__prev" style="left:${pos(it.prev)}%"></div>${isNaN(v) ? '' : `<div class="p-gauge__mark" style="left:${pos(v)}%"></div>`}</div>
          <div class="p-gauge-legend"><span>低い</span><span>基準の範囲（細い線は前回）</span><span>高い</span></div></div></div>
        ${isNaN(v) ? '' : v < it.min || v > it.max ? `<div class="ds-alert ds-alert--warning">${icon('warning')}<div class="ds-alert__body">基準から外れている（${v.toFixed(2)} ${it.unit}）。測り直してから「要注意」か「異常」を記録する。</div></div>` : `<span class="ds-status ds-status--success">${icon('success')}基準の範囲（前回より ${(it.prev - v).toFixed(2)} 低い）</span>`}
      </section>`;
    }
    const val = S[it.id];
    return `<section class="p-item" id="check-${it.id}"${val ? ` data-state="${val}"` : ''}>
      <div class="p-item__head"><h2>${it.title}</h2><button type="button" class="ds-btn ds-btn--link" data-act="criteria" data-id="${it.id}" aria-expanded="${S.open === it.id}">${icon('help')}判断の基準</button></div>
      ${S.open === it.id ? `<p class="p-criteria" id="criteria-${it.id}"><b>判断の基準</b>${esc(it.criteria)} <span class="p-unimpl">音の見本：未実装</span></p>` : ''}
      <div class="ds-segmented" role="group" aria-label="${it.title}の判定">${JUDGE.map(([k, l]) => `<button type="button" data-act="judge" data-id="${it.id}" data-v="${k}" aria-pressed="${val === k}">${l}</button>`).join('')}</div>
      ${it.id === 'sound' && S.sent ? `<div class="ds-alert ds-alert--success" id="sent-note">${icon('success')}<div class="ds-alert__body"><div class="ds-alert__title">保全に送った（8:47）</div>所見：金属のこすれる音 ・ 写真 1 枚。${S.accepted ? '大野が受け取った。' : '受け取りを待っている。'}</div></div>` : ''}
    </section>`;
  }

  function routeScreen() {
    const list = equipments(), e = list[S.eq] || list[0];
    const answered = ITEMS.filter(it => it.kind === 'num' ? S.pressure !== '' : S[it.id]).length;
    const next = list[S.eq + 1];
    return `<section class="ds-screen" aria-labelledby="eq-title">
      <header class="ds-appbar"><div class="ds-appbar__row"><h1 class="ds-appbar__title">日常点検　第2ライン<span class="ds-appbar__sub">高木 涼 ・ 8:30 開始 ・ ${S.eq} / ${list.length} 設備が済み</span></h1>
        <div class="ds-appbar__actions"><button type="button" class="ds-btn ds-btn--icon" aria-label="点検表を印刷（未実装）">${icon('file')}</button></div></div></header>
      ${routeBar(list)}
      ${S.resumed ? `<div class="ds-banner" id="resume-banner">${icon('info')}<div class="ds-banner__body">${esc(e.id)} の途中から続ける（8:52〜9:04 に中断）。記録したのは ${answered} / ${ITEMS.length} 項目。</div></div>` : ''}
      <main class="ds-content"><div class="ds-pad ds-stack">
        <div class="p-eq"><div><h1 id="eq-title">${esc(e.id)}　${esc(e.name)}</h1><div class="ds-text-small">${esc(e.place || '第2ライン')} ・ ${e.noPrev ? '前回の記録なし' : '前回：昨日 8:41 宮下 ・ すべて正常'}</div></div>
          <span class="ds-badge">${answered} / ${ITEMS.length} 項目</span></div>
        ${S.eq === 2 ? ITEMS.map(itemHtml).join('') : `<div class="ds-alert">${icon('info')}<div class="ds-alert__body">この設備の点検項目は、見本では省いている（未実装）。</div></div>`}
      </div></main>
      <div class="ds-bottombar">
        <button type="button" class="ds-btn" data-act="prev"${S.eq === 0 ? ' disabled' : ''}>${icon('arrow-left')}前の設備</button>
        <button type="button" class="ds-btn ds-btn--primary" id="next-btn" data-act="next">${next ? `次の設備へ（${esc(next.id)}）` : '点検を終える'}${icon('arrow-right')}</button>
      </div>
    </section>`;
  }

  function abnormalSheet() {
    const findings = ['金属のこすれる音', '周期的な打音', '振動が大きい', '漏れ'];
    const picked = new Set(String(S.picked || '').split(',').filter(Boolean).map(Number));
    if (S.finding) picked.add(0);
    return `<div class="ds-scrim" data-act="closeSheet"></div>
    <div class="ds-sheet p-sheet-wide" role="dialog" aria-labelledby="ab-title" id="abnormal-sheet">
      <button type="button" class="ds-sheet__handle" data-act="closeSheet" aria-label="閉じる"></button>
      <div class="ds-sheet__header"><h2 class="ds-sheet__title" id="ab-title">異常を記録する
        <span class="p-ab-context">P-03 冷却水ポンプ ・ 異音 <span class="ds-status ds-status--error">${icon('error')}異常</span> ・ 第2ライン 東側・床下ピット</span></h2></div>
      <div class="ds-sheet__body ds-stack">
        <div class="p-ab-grid">
          <div>
            <p class="p-ab-label">所見（当てはまるものをすべて選ぶ）</p>
            <ul class="p-find" id="finding-chips">${findings.map((f, i) => `<li><button type="button" aria-pressed="${picked.has(i)}" data-act="finding" data-i="${i}"><span class="p-find__box">${icon('check')}</span>${f}</button></li>`).join('')}</ul>
            <label class="p-ab-label" for="ab-note" style="display:block;margin-top:16px">気付いたこと（任意）</label>
            <textarea class="ds-textarea" id="ab-note" placeholder="いつから、どのくらいの音か、ほかに変わったこと" data-act="note">${esc(S.note || '')}</textarea>
          </div>
          <div>
            <p class="p-ab-label">写真</p>
            <div class="p-photo${S.photo ? ' is-taken' : ''}" id="photo">${icon('image')}<span>${S.photo ? '写真 1 枚（ポンプの軸受けの付近）' : 'まだ撮っていない'}</span><span class="p-unimpl">撮影：未実装</span></div>
            <button type="button" class="ds-btn ds-btn--block" style="margin-top:8px" data-act="photo">${icon('image')}${S.photo ? '撮り直す' : '写真を撮る'}</button>
          </div>
        </div>
        <div class="ds-alert">${icon('info')}<div class="ds-alert__body">保全（大野）に、所見と写真が届く。運転を止めるかは、班長と保全が決める。</div></div>
      </div>
      <div class="ds-sheet__footer"><button type="button" class="ds-btn" data-act="closeSheet">あとで</button><button type="button" class="ds-btn ds-btn--primary" id="send-abnormal" data-act="send">記録して保全に送る</button></div>
    </div>`;
  }

  function doneScreen() {
    const list = equipments();
    return `<section class="ds-screen" aria-labelledby="done-title">
      <header class="ds-appbar"><div class="ds-appbar__row"><h1 class="ds-appbar__title" id="done-title">日常点検　第2ライン<span class="ds-appbar__sub">高木 涼 ・ 9:38 終了</span></h1></div></header>
      <main class="ds-content"><div class="ds-pad ds-stack">
        <div class="ds-stats" id="summary-done">
          <div class="ds-stat"><span class="ds-stat__label">記録した設備</span><span class="ds-stat__value">${list.length}<span class="ds-stat__unit">設備</span></span><span class="ds-stat__delta">${list.length * 4} 項目</span></div>
          <div class="ds-stat"><span class="ds-stat__label">異常 ・ 要注意</span><span class="ds-stat__value">1 ・ 1<span class="ds-stat__unit">件</span></span><span class="ds-stat__delta">P-03 異音 ・ C-01 振動</span></div>
        </div>
        <div class="ds-alert ${S.accepted ? 'ds-alert--success' : ''}" id="handoff-status">${icon(S.accepted ? 'success' : 'clock')}<div class="ds-alert__body"><div class="ds-alert__title">${S.accepted ? '保全（大野）が受け取った（9:40）' : '保全の受け取りを待っている'}</div>P-03 冷却水ポンプ：金属のこすれる音。写真 1 枚。${S.accepted ? '「昼に止めて軸受けを見る」' : ''}</div></div>
      </div></main>
    </section>`;
  }

  /* ---------- 操作 ---------- */
  function set(p) { Object.assign(S, p); render(); }
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'judge') { const p = { [b.dataset.id]: b.dataset.v }; if (b.dataset.v === 'ng') p.sheet = 'abnormal'; set(p); }
    else if (a === 'criteria') set({ open: S.open === b.dataset.id ? null : b.dataset.id });
    else if (a === 'finding') {
      const i = Number(b.dataset.i);
      if (i === 0) set({ finding: !S.finding });
      else { const p = new Set(String(S.picked || '').split(',').filter(Boolean)); p.has(String(i)) ? p.delete(String(i)) : p.add(String(i)); set({ picked: [...p].join(',') }); }
    }
    else if (a === 'photo') set({ photo: true });
    else if (a === 'send') set({ sheet: null, sent: true });
    else if (a === 'closeSheet') set({ sheet: null });
    else if (a === 'next') { if (S.eq + 1 >= equipments().length) set({ screen: 'done' }); else set({ eq: S.eq + 1 }); }
    else if (a === 'prev') set({ eq: Math.max(0, S.eq - 1) });
  });
  app.addEventListener('change', e => { if (e.target.dataset.act === 'pressure') set({ pressure: e.target.value }); if (e.target.dataset.act === 'note') S.note = e.target.value; });
  document.querySelector('.dv-controls').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.scn) set(Object.assign({}, DEFAULT, { scn: b.dataset.scn }));
    if (b.dataset.ev === 'resume') set({ resumed: true, eq: 3, time: '9:06' });
    if (b.dataset.ev === 'accept') set({ screen: 'done', sent: true, accepted: true, time: '9:40' });
  });

  /* ---------- 端末の「戻る」：開いているシートを閉じ、前の設備へ戻る ---------- */
  function appBack() {
    if (S.sheet) { set({ sheet: null }); return true; }
    if (S.screen === 'route' && S.eq > 0) { set({ eq: S.eq - 1 }); return true; }
    return false;
  }


  document.addEventListener('DOMContentLoaded', () => {
    if (window.ds && ds.back) { const dsBack = ds.back; ds.back = scope => appBack() || dsBack(scope); }
  });
  window.addEventListener('load', render);

  /* ---------- デモから状態を当てる ---------- */
  window.uxDemoApply = function (state) {
    S = Object.assign({}, DEFAULT, state);
    render();
    const home = document.querySelector('.dv-home');
    if (home && !home.hidden && window.dv && dv.openApp) dv.openApp(document.getElementById('phone'));
  };
  render();
})();
</script>
</body>
</html>
