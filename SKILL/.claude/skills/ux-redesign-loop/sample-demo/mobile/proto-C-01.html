<!DOCTYPE html>
<!--
  見本のプロトタイプ（スマートフォン）：C-01「規定どおりの申請はまとめて承認し、規定から外れた申請だけを根拠と一緒に 1 件ずつ判断する」
  - 反復：iter-01（架空の案件「経費精算の承認をスマートフォンで行う」）
  - 検証する仮説：H-01 まとめて承認、H-02 外れた規定と値を並べる、H-03 差し戻しの理由を選ぶ、H-04 通信が切れても判断を端末に残す
  - 模擬している部分：申請のデータは JavaScript で作った架空のもの。通信の切断・申請者の出し直し・経理の差し戻しは状態の切替えで模擬
  - 未実装：領収書の写真の拡大、承認済みと設定のタブ、検索（画面に「未実装」と表示）
  - デザインシステム：既定の DS（sample-design-system-mobile）、見た目はミニマル。端末の枠（device.css / device.js）で表示し、下の操作の帯は 3 つのボタン（戻る・ホーム・履歴）に固定する（data-nav-fixed）。DS 外の部品：なし
  - デモ：demo-bridge.js を読み込み、window.uxDemoApply で台本の状態を受け取る。デモの中では端末の操作盤（検証用）を隠す
  - データ：実在の会社・店・電話番号を使わない（references/prototype.md の「データ」）
-->

    { id: 'a3', who: '高橋 健太郎', kind: '出張', title: '大阪 往復 新幹線（見本商事株式会社 第二営業部への提案と、翌日の現地打合せ・設置立会い）', yen: 28600, late: true },
    { id: 'a4', who: '小林 拓也', kind: '交通費', title: '見本物流有限会社への訪問', yen: 820 },
    { id: 'a5', who: '伊藤 さやか', kind: '会議費', title: '社内勉強会の飲み物（12 名）', yen: 3100 },
    { id: 'a6', who: '鈴木 美奈', kind: '交通費', title: '架空テクノサービス株式会社への訪問', yen: 1580 },
    { id: 'a7', who: '渡辺 翔', kind: '書籍', title: '業務改善の参考書', yen: 3520 }
  ];
  const R1 = { id: 'r1', who: '小林 拓也', kind: '会議費', title: '取引先との会食（4 名）', yen: 32400, date: '11/6（金）19:30', place: '見本亭', people: '社外 2 名（サンプル精機株式会社）、社内 2 名' };
  const R2 = { id: 'r2', who: '渡辺 翔', kind: '交通費', title: '残業後のタクシー（会社〜自宅）', yen: 6800, date: '11/5（木）21:40' };
  const yen = n => '¥' + n.toLocaleString('ja-JP');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function okItems() {
    if (S.scn === 'empty') return [];
    if (S.scn !== 'large') return OK_ITEMS;
    const out = OK_ITEMS.slice();
    for (let i = 0; i < 55; i++) out.push({ id: 'g' + i, who: ['小林 拓也', '鈴木 美奈', '伊藤 さやか', '渡辺 翔'][i % 4], kind: '交通費', title: '顧客訪問 ' + (i + 1) + ' 件目', yen: 400 + (i * 137) % 2000 });
    return out;
  }

  /* ---------- 状態 ---------- */
  const DEFAULT = { scn: 'normal', time: '8:10', screen: 'inbox', item: null, sheet: null, approvedBulk: false, offline: false, returned: false, sent: false, resubmitted: false, approvedR1: false, approvedR2: false, acct: false };
  let S = Object.assign({}, DEFAULT);
  const app = document.getElementById('app');
  const icon = n => `<svg class="ds-icon" aria-hidden="true"><use href="#ds-i-${n}"/></svg>`;

  function needItems() {
    if (S.scn === 'empty') return [];
    const out = [];
    if (!S.approvedR1 && (!S.returned || S.resubmitted)) out.push(R1);
    if (!S.approvedR2) out.push(R2);
    return out;
  }

  function render() {
    const phone = document.getElementById('phone');
    phone.dataset.time = S.time;
    const t = document.querySelector('.dv-time'); if (t) t.textContent = S.time;
    const detail = S.screen === 'detail';
    // 描き直す前に、アプリの中の焦点を外す。入力欄に焦点があるまま描き直すと、入力欄だけが消えて
    // 焦点が外れたことが伝わらず、端末のキーボード（device.js）が出たまま残るため
    const focused = document.activeElement;
    if (focused && app.contains(focused)) focused.blur();
    app.innerHTML = `<div class="ds-app__stack">${detail ? detailScreen() : inboxScreen()}</div>
      <nav class="ds-tabbar" aria-label="アプリの行き先"${detail ? ' hidden' : ''}>
        <button type="button" class="ds-tabbar__item" aria-current="page"><span class="ds-tabbar__icon">${icon('inbox')}${needItems().length + (S.approvedBulk ? 0 : okItems().length) ? `<span class="ds-count">${needItems().length + (S.approvedBulk ? 0 : okItems().length)}</span>` : ''}</span>承認待ち</button>
        <button type="button" class="ds-tabbar__item" data-act="unimpl"><span class="ds-tabbar__icon">${icon('success')}</span>承認済み</button>
        <button type="button" class="ds-tabbar__item" data-act="unimpl"><span class="ds-tabbar__icon">${icon('settings')}</span>設定</button>
      </nav>
      ${S.sheet === 'bulk' ? bulkSheet() : ''}${S.sheet === 'return' ? returnSheet() : ''}`;
    document.querySelectorAll('#scn [data-scn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.scn === S.scn)));
  }

  function offlineBanner() {
    return S.offline ? `<div class="ds-banner ds-banner--warning" id="offline-banner">${icon('warning')}<div class="ds-banner__body">通信が切れている。承認と差し戻しはこの端末に残し、つながったら送る。</div></div>` : '';
  }

  function inboxScreen() {
    const ok = S.approvedBulk ? [] : okItems();
    const need = needItems();
    const sum = ok.reduce((a, x) => a + x.yen, 0);
    const waiting = S.returned && !S.resubmitted;
    let body = '';
    if (S.acct) body += `<div class="ds-pad"><div class="ds-alert ds-alert--error" id="acct-banner">${icon('error')}<div class="ds-alert__body"><div class="ds-alert__title">経理（森）が 1 件を差し戻した</div>高橋 健太郎「大阪 往復 新幹線」：領収書の日付が先月（10/28）。まとめて承認した ${okItems().length} 件のうちの 1 件。</div></div></div>`;
    if (S.resubmitted && !S.approvedR1) body += `<div class="ds-pad"><div class="ds-alert" id="resubmit-banner">${icon('info')}<div class="ds-alert__body"><div class="ds-alert__title">小林 拓也さんが出し直した（11:38）</div>取引先との会食：区分を交際費にし、事前申請の番号を付けた。</div></div></div>`;
    if (S.approvedBulk) body += `<div class="ds-pad"><div class="ds-alert ds-alert--success" id="done-note">${icon('success')}<div class="ds-alert__body"><div class="ds-alert__title">規定どおりの ${okItems().length} 件を承認した（8:14）</div>合計 ${yen(okItems().reduce((a, x) => a + x.yen, 0))}。経理に送った。<div class="ds-alert__actions"><button type="button" class="ds-btn ds-btn--link" data-act="undoBulk">元に戻す</button></div></div></div></div>`;
    if (!ok.length && !need.length && !waiting) {
      body += `<div class="ds-empty"><span class="ds-empty__icon">${icon('success')}</span><p class="ds-empty__title">承認待ちはない</p><p class="ds-empty__body">新しい申請が届くと、ここに並ぶ。</p></div>`;
    }
    if (ok.length || need.length) {
      body += `<div class="ds-pad"><div class="ds-stats" id="summary">
        <div class="ds-stat"><span class="ds-stat__label">規定どおり</span><span class="ds-stat__value">${ok.length}<span class="ds-stat__unit">件</span></span><span class="ds-stat__delta">${yen(sum)}</span></div>
        <div class="ds-stat"><span class="ds-stat__label">確認が必要</span><span class="ds-stat__value">${need.length}<span class="ds-stat__unit">件</span></span><span class="ds-stat__delta">締め 今日 17:00</span></div>
      </div></div>`;
    }
    if (need.length) {
      body += `<p class="p-section"><span>確認が必要</span><span>規定から外れている</span></p><ul class="ds-list" id="need-list">${need.map(x => `<li><a class="ds-cell ds-cell--2line" href="#" data-act="open" data-id="${x.id}" id="row-${x.id}">
        <span class="ds-cell__body"><span class="ds-cell__title">${esc(x.title)}</span><span class="ds-cell__sub">${esc(x.who)} ・ ${esc(x.kind)}</span>
        <span class="ds-cell__meta"><span class="ds-status ds-status--warning">${icon('warning')}${x.id === 'r1' ? (S.resubmitted ? '出し直し' : '1 人あたりの上限超え') : '深夜の時間帯の前'}</span></span></span>
        <span class="ds-cell__trail"><span class="p-amount">${yen(x.yen)}</span>${icon('angle-right').replace('ds-icon', 'ds-icon ds-cell__chevron')}</span></a></li>`).join('')}</ul>`;
    }
    if (waiting) {
      body += `<p class="p-section"><span>返事待ち</span></p><ul class="ds-list" id="waiting-list"><li><div class="ds-cell ds-cell--2line">
        <span class="ds-cell__body"><span class="ds-cell__title">${esc(R1.title)}</span><span class="ds-cell__sub">${esc(R1.who)} ・ 差し戻し</span>
        <span class="ds-cell__meta" id="return-status">${S.offline ? `<span class="ds-status ds-status--pending">${icon('clock')}送信待ち（つながったら送る）</span>` : `<span class="ds-status ds-status--info">${icon('send')}差し戻した（8:24）</span>`}</span></span>
        <span class="ds-cell__trail"><span class="p-amount">${yen(R1.yen)}</span></span></div></li></ul>`;
    }
    if (ok.length) {
      const shown = ok.slice(0, 20);
      body += `<p class="p-section"><span>規定どおり</span><span>${ok.length} 件</span></p><ul class="ds-list" id="ok-list">${shown.map(x => `<li><div class="ds-cell ds-cell--2line">
        <span class="ds-cell__body"><span class="ds-cell__title">${esc(x.title)}</span><span class="ds-cell__sub">${esc(x.who)} ・ ${esc(x.kind)}</span></span>
        <span class="ds-cell__trail"><span class="p-amount">${yen(x.yen)}</span></span></div></li>`).join('')}</ul>
        ${ok.length > shown.length ? `<p class="ds-list__footer">ほか ${ok.length - shown.length} 件。まとめて承認の画面で全件を確かめられる。</p>` : ''}`;
    }
    return `<section class="ds-screen" aria-labelledby="t-inbox">
      <header class="ds-appbar ds-appbar--large">
        <div class="ds-appbar__row"><p class="ds-appbar__title" aria-hidden="true">承認待ち</p>
          <div class="ds-appbar__actions"><button type="button" class="ds-btn ds-btn--icon" aria-label="検索（未実装）" data-act="unimpl">${icon('search')}</button></div></div>
        <h1 class="ds-appbar__large" id="t-inbox">承認待ち</h1>
      </header>
      ${offlineBanner()}
      <main class="ds-content">${body}<div style="height:var(--ds-space-xl)"></div></main>
      ${ok.length ? `<div class="ds-bottombar"><button type="button" class="ds-btn ds-btn--primary ds-btn--block" id="bulk-btn" data-act="bulk">規定どおりの ${ok.length} 件をまとめて承認</button></div>` : ''}
    </section>`;
  }

  function detailScreen() {
    const x = S.item === 'r2' ? R2 : R1;
    let rule, kv;
    if (x.id === 'r1' && S.resubmitted) {
      rule = `<div class="ds-alert ds-alert--success" id="rule-gap">${icon('success')}<div class="ds-alert__body"><div class="ds-alert__title">規定どおり</div>交際費（事前申請 交-2026-118）。1 人あたり 10,000 円まで。
        <dl class="p-gap"><dt>1 人あたり</dt><dd>8,100 円</dd><dt>上限</dt><dd>10,000 円</dd></dl></div></div>
        <div class="ds-card" id="changes"><h2 class="ds-h4" style="margin:0 0 4px">前回からの変更</h2><ul class="p-checks"><li>${icon('edit')}区分：会議費 → 交際費</li><li>${icon('edit')}事前申請の番号を追加：交-2026-118</li></ul></div>`;
    } else if (x.id === 'r1') {
      rule = `<div class="ds-alert ds-alert--warning" id="rule-gap">${icon('warning')}<div class="ds-alert__body"><div class="ds-alert__title">規定から外れている</div>会議費の会食は、1 人あたり 5,000 円まで。
        <dl class="p-gap"><dt>1 人あたり</dt><dd class="p-over">8,100 円（3,100 円超え）</dd><dt>上限</dt><dd>5,000 円</dd><dt>事前申請</dt><dd class="p-over">なし</dd></dl></div></div>`;
    } else {
      rule = `<div class="ds-alert ds-alert--warning" id="rule-gap">${icon('warning')}<div class="ds-alert__body"><div class="ds-alert__title">規定から外れている</div>タクシーは 22 時以降の乗車だけが対象。
        <dl class="p-gap"><dt>乗車</dt><dd class="p-over">21:40</dd><dt>対象</dt><dd>22:00 以降</dd></dl></div></div>`;
    }
    kv = `<dl class="ds-kv ds-kv--2col">
      <div><dt>申請者</dt><dd>${esc(x.who)}</dd></div><div><dt>金額</dt><dd class="p-amount">${yen(x.yen)}</dd></div>
      <div><dt>区分</dt><dd>${x.id === 'r1' && S.resubmitted ? '交際費' : esc(x.kind)}</dd></div><div><dt>日時</dt><dd>${esc(x.date)}</dd></div>
      ${x.place ? `<div><dt>店</dt><dd>${esc(x.place)}</dd></div>` : ''}${x.people ? `<div><dt>参加者</dt><dd>${esc(x.people)}</dd></div>` : ''}</dl>`;
    return `<section class="ds-screen" data-tabbar="hidden" aria-labelledby="d-title">
      <header class="ds-appbar"><div class="ds-appbar__row">
        <button type="button" class="ds-btn ds-btn--icon" data-act="back" aria-label="戻る" id="back-btn">${icon('arrow-left')}</button>
        <h1 class="ds-appbar__title" id="d-title">${esc(x.title)}<span class="ds-appbar__sub">${esc(x.who)} ・ ${yen(x.yen)}</span></h1></div></header>
      ${offlineBanner()}
      <main class="ds-content"><div class="ds-pad ds-stack">
        ${rule}${kv}
        <div class="p-receipt" id="receipt">${icon('image')}<span>領収書の写真</span><span class="p-unimpl">拡大は未実装</span></div>
      </div></main>
      <div class="ds-bottombar">
        <button type="button" class="ds-btn" id="return-btn" data-act="returnSheet">${icon('undo')}差し戻す</button>
        <button type="button" class="ds-btn ds-btn--primary" id="approve-btn" data-act="approve">${icon('success')}承認する</button>
      </div>
    </section>`;
  }

  function bulkSheet() {
    const ok = okItems(), sum = ok.reduce((a, x) => a + x.yen, 0);
    return `<div class="ds-scrim" data-act="closeSheet"></div>
    <div class="ds-sheet" role="dialog" aria-labelledby="bs-title" id="bulk-sheet">
      <button type="button" class="ds-sheet__handle" data-act="closeSheet" aria-label="閉じる"></button>
      <div class="ds-sheet__header"><h2 class="ds-sheet__title" id="bs-title">規定どおりの ${ok.length} 件を承認する</h2></div>
      <div class="ds-sheet__body ds-stack">
        <div class="ds-card" id="bulk-checks"><h3 class="ds-h4" style="margin:0 0 6px">自動で確かめたこと</h3><ul class="p-checks">
          <li>${icon('check')}金額が区分ごとの上限の中にある</li><li>${icon('check')}領収書の写真が付いている</li><li>${icon('check')}必要な事前申請がある</li></ul></div>
        <div class="p-total"><span>合計</span><b>${yen(sum)}</b></div>
        <ul class="ds-list p-sheet-list" style="margin-inline:calc(var(--ds-space-screen) * -1)">${ok.slice(0, 20).map(x => `<li><div class="ds-cell"><span class="ds-cell__body"><span class="ds-cell__title">${esc(x.title)}</span><span class="ds-cell__sub">${esc(x.who)}</span></span><span class="ds-cell__trail"><span class="p-amount">${yen(x.yen)}</span></span></div></li>`).join('')}</ul>
      </div>
      <div class="ds-sheet__footer"><button type="button" class="ds-btn" data-act="closeSheet">やめる</button><button type="button" class="ds-btn ds-btn--primary" id="bulk-ok" data-act="bulkOk">${ok.length} 件を承認する</button></div>
    </div>`;
  }

  function returnSheet() {
    const reasons = [['pre', '事前申請がない', true], ['limit', '1 人あたりの上限を超えている', true], ['receipt', '領収書が読めない', false], ['other', 'その他', false]];
    return `<div class="ds-scrim" data-act="closeSheet"></div>
    <div class="ds-sheet" role="dialog" aria-labelledby="rs-title" id="return-sheet">
      <button type="button" class="ds-sheet__handle" data-act="closeSheet" aria-label="閉じる"></button>
      <div class="ds-sheet__header"><h2 class="ds-sheet__title" id="rs-title">差し戻す理由</h2></div>
      <div class="ds-sheet__body ds-stack">
        <p class="ds-text-small" style="margin:0">外れていた規定から、理由を選んである。申請者には、理由と直し方が届く。</p>
        <ul class="ds-list ds-list--inset" id="return-reasons">${reasons.map(([v, t, on]) => `<li><label class="ds-cell"><span class="ds-cell__body"><span class="ds-cell__title">${t}</span></span><span class="ds-choice"><input type="checkbox" value="${v}"${on ? ' checked' : ''}></span></label></li>`).join('')}</ul>
        <div class="ds-field"><label class="ds-field__label" for="rs-note">直し方の案内</label>
          <textarea class="ds-textarea" id="rs-note">交際費として、事前申請の番号を付けて出し直してください。</textarea></div>
      </div>
      <div class="ds-sheet__footer"><button type="button" class="ds-btn ds-btn--primary ds-btn--block" id="return-send" data-act="returnSend">差し戻しを送る</button></div>
    </div>`;
  }

  /* ---------- 操作 ---------- */
  function set(p) { Object.assign(S, p); render(); }
  const snack = message => { if (window.ds && ds.snackbar) ds.snackbar({ message, within: app }); };
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    e.preventDefault();
    const a = b.dataset.act;
    if (a === 'open') set({ screen: 'detail', item: b.dataset.id });
    else if (a === 'back') set({ screen: 'inbox', item: null, sheet: null });
    else if (a === 'bulk') set({ sheet: 'bulk' });
    else if (a === 'closeSheet') set({ sheet: null });
    else if (a === 'bulkOk') { set({ sheet: null, approvedBulk: true }); snack(okItems().length + ' 件を承認した'); }
    else if (a === 'undoBulk') set({ approvedBulk: false });
    else if (a === 'returnSheet') set({ sheet: 'return' });
    else if (a === 'returnSend') { set({ sheet: null, screen: 'inbox', item: null, returned: true, sent: !S.offline }); snack(S.offline ? '差し戻しを端末に残した。つながったら送る' : '差し戻した'); }
    else if (a === 'approve') { set(S.item === 'r2' ? { approvedR2: true, screen: 'inbox', item: null } : { approvedR1: true, screen: 'inbox', item: null }); snack('承認した'); }
    else if (a === 'unimpl') snack('この見本では未実装');
  });
  document.querySelector('.dv-controls').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.scn) set(Object.assign({}, DEFAULT, { scn: b.dataset.scn }));
    if (b.dataset.ev === 'offline') set({ offline: !S.offline });
    if (b.dataset.ev === 'resubmit') set({ returned: true, resubmitted: true, time: '11:40' });
    if (b.dataset.ev === 'acct') set({ approvedBulk: true, acct: true, time: '16:30' });
  });

  /* ---------- 端末の「戻る」 ----------
     端末の戻るボタン・端から払う・Esc は、device.js が ds.back() を呼ぶ。このプロトタイプは画面とシートを
     状態から描いていて ds.push / ds.open を使わないので、ds.back の前にこの画面の戻り方を当てる。
     戻れないとき（承認待ちの画面）は ds.back に任せ、端末はホーム画面へ移る */
  function appBack() {
    if (S.sheet) { set({ sheet: null }); return true; }
    if (S.screen === 'detail') { set({ screen: 'inbox', item: null }); return true; }
    return false;
  }
  document.addEventListener('DOMContentLoaded', () => {
    if (!window.ds || !ds.back) return;
    const dsBack = ds.back;
    ds.back = scope => appBack() || dsBack(scope);
  });

  /* ---------- デモから状態を当てる ---------- */
  window.uxDemoApply = function (state) {
    S = Object.assign({}, DEFAULT, state);
    render();
    // 触っているうちにホーム画面へ移っていたら、アプリへ戻す（デモの場面はアプリの中の出来事）
    const home = document.querySelector('.dv-home');
    if (home && !home.hidden && window.dv && dv.openApp) dv.openApp(document.getElementById('phone'));
  };
  // device.js が時刻の帯を作ったあとで描く（時刻を合わせるため）
  window.addEventListener('load', render);
  render();
})();
</script>
</body>
</html>
