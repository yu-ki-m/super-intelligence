<!DOCTYPE html>
<!--
  見本の画面一覧キャンバス：K-01（PC。C-02 / iter-01）
  CSV 取込のプロトタイプ（proto-C-02.html）の 6 つの状態を、スクロールした先まで含めた全体のフレームとして並べる。
  書き方は references/canvas.md。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面一覧 K-01 CSV 取込</title>
<script>
  try { const t = localStorage.getItem('ds-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<link rel="stylesheet" href="../sample-design-system/tokens.css">
<link rel="stylesheet" href="../sample-design-system/components.css">
<link rel="stylesheet" href="../screen-canvas/canvas.css">
<script src="../sample-design-system/components.js" defer></script>
<script>
window.UX_CANVAS = {
  id: 'K-01',
  title: 'CSV 取込：画面の全体と、情報の置き場所',
  refs: { case: 'C-02', iteration: 'iter-01' },
  prototype: 'proto-C-02.html',
  device: 'pc',
  screens: [
    { id: 's-upload', row: 0, title: 'ファイルを選んだ', desc: '取込の入口', state: { screen: 'upload', file: true },
      marks: [{ sel: '#file-row', text: '選んだファイルの名前・大きさ・行数。取り違えていないかを、ここで確かめる' },
              { sel: '#check-btn', text: '取り込む前に、全行を検査する。検査では顧客データは変わらない' }] },
    { id: 's-checking', row: 0, title: '検査している', desc: '待っている間', state: { screen: 'checking', file: true, progress: 62 },
      marks: [{ sel: '#check-progress', text: '進み具合・残り時間・途中で見つかった問題の数' },
              { sel: '#leave-note', text: '画面を離れても検査は続き、終わると通知が来る' }] },
    { id: 's-review', row: 0, title: '検査の結果', desc: '47 行に問題', state: { screen: 'review', file: true, progress: 100 },
      marks: [{ sel: '#summary', text: '取り込める行と、直す必要がある行の数' },

    { id: 's-done', row: 1, title: '取り込んだ', desc: '保留 12 行', state: { screen: 'done', file: true, fixedPhone: true, fixedEmail: true, imported: 3202 },

              { sel: '#handoff-btn', text: '担当者マスタの管理者に、追加を頼む' }] },
    { id: 's-morning', row: 1, title: '翌朝に開く', desc: '保留を片付ける', state: { screen: 'done', file: true, fixedPhone: true, fixedEmail: true, imported: 3202, handoff: true, morning: true },

  flows: [

    { from: 's-done', to: 's-morning', auto: true, label: '翌朝に開く' }

  notes: [
    { type: 'text', near: 's-upload', dx: 0, dy: -420, text: 'CSV 取込の画面の全体（C-02）' },

    { type: 'sticky', near: 's-review', dx: 1660, dy: 60, color: 'pink', text: '47 行を一度に見せて、怖がらせないか？ 理由ごとのまとまりで和らげられるか（H-02）' },
    { type: 'sticky', near: 's-morning', dx: 1660, dy: 60, color: 'blue', text: '翌朝、保留が入口に出ているか。出ていなければ、保留の行は忘れられる（H-05）' }
  ]
};
</script>
<script src="../screen-canvas/canvas.js" defer></script>
</head>

</html>
