<script>
  /* 保存した画面の明るさと見た目を、描画の前に当てる（違う見た目が一瞬出るのを防ぐ） */
  try {
    const t = localStorage.getItem('ds-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    const l = localStorage.getItem('ds-look'); if (l === 'console') document.documentElement.dataset.look = l; else if (l === 'minimal') delete document.documentElement.dataset.look;
  } catch (_) {}
</script>

<div class="ds-stage" id="stage">
  <canvas class="ds-stage__canvas" aria-hidden="true"></canvas>

  <header class="ds-stage__bar">
    <span class="ds-stage__brand"><svg class="ds-icon"><use href="#ds-i-shield"/></svg>Sample Workbench</span>
    <span class="ds-stage__spacer"></span>
    <details class="ds-menu ds-menu--end">
      <summary class="ds-btn ds-btn--icon" aria-label="見た目"><svg class="ds-icon"><use href="#ds-i-monitor"/></svg></summary>
      <div class="ds-menu__list" role="menu" aria-label="見た目">
        <p class="ds-menu__group" style="margin:0">見た目</p>
        <button class="ds-menu__item" role="menuitemradio" data-look-choice="minimal" aria-checked="true">ミニマル<svg class="ds-icon ds-menu__check"><use href="#ds-i-check"/></svg></button>
        <button class="ds-menu__item" role="menuitemradio" data-look-choice="console" aria-checked="false">コンソール<svg class="ds-icon ds-menu__check"><use href="#ds-i-check"/></svg></button>
      </div>
    </details>
    <details class="ds-menu ds-menu--end">
      <summary class="ds-btn ds-btn--icon" aria-label="画面の明るさ"><svg class="ds-icon"><use href="#ds-i-theme"/></svg></summary>
      <div class="ds-menu__list" role="menu" aria-label="画面の明るさ">
        <p class="ds-menu__group" style="margin:0">画面の明るさ</p>
        <button class="ds-menu__item" role="menuitemradio" data-theme-choice="auto" aria-checked="true"><svg class="ds-icon"><use href="#ds-i-theme"/></svg>パソコンの設定に合わせる<svg class="ds-icon ds-menu__check"><use href="#ds-i-check"/></svg></button>
        <button class="ds-menu__item" role="menuitemradio" data-theme-choice="light" aria-checked="false"><svg class="ds-icon"><use href="#ds-i-sun"/></svg>明るい<svg class="ds-icon ds-menu__check"><use href="#ds-i-check"/></svg></button>
        <button class="ds-menu__item" role="menuitemradio" data-theme-choice="dark" aria-checked="false"><svg class="ds-icon"><use href="#ds-i-moon"/></svg>暗い<svg class="ds-icon ds-menu__check"><use href="#ds-i-check"/></svg></button>
      </div>
    </details>
  </header>

  <main class="ds-stage__center">
    <section class="ds-stage__card" aria-labelledby="stage-title">
      <span class="ds-stage__eyebrow"><span class="ds-stage__eyebrow-dot" aria-hidden="true"></span>新しい課題が 2 件あります</span>
      <h1 class="ds-stage__title" id="stage-title">検出結果を見抜く</h1>
      <p class="ds-stage__lead">ツールが報告した脆弱性を調べ、<br>本当に対応が必要かを判定する。</p>
      <div class="ds-stage__actions">
        <button class="ds-btn ds-btn--primary" id="start" autofocus>はじめる<kbd class="ds-kbd">Enter</kbd></button>
        <button class="ds-btn" id="resume"><svg class="ds-icon"><use href="#ds-i-refresh"/></svg>続きから<span class="ds-stage__btn-meta">課題 3・きのう 21:40</span></button>
      </div>
      <div class="ds-stage__links">
        <button class="ds-btn ds-btn--link" onclick="document.getElementById('settings').showModal()"><svg class="ds-icon"><use href="#ds-i-settings"/></svg>設定</button>
        <a class="ds-btn ds-btn--link" href="index.html"><svg class="ds-icon"><use href="#ds-i-help"/></svg>遊び方</a>
      </div>
    </section>
  </main>

  <footer class="ds-stage__foot">
    <span>v0.3.0</span>
    <span>背景の動きは 設定 から止められます</span>
  </footer>
</div>

<dialog class="ds-modal" id="settings" aria-labelledby="settings-title">
  <form method="dialog">
    <div class="ds-modal__header">
      <h2 class="ds-modal__title" id="settings-title">設定</h2>
      <button class="ds-btn ds-btn--icon" value="cancel" aria-label="閉じる"><svg class="ds-icon"><use href="#ds-i-close"/></svg></button>
    </div>
    <div class="ds-modal__body">
      <div class="ds-settings">
        <div class="ds-setting">
          <div class="ds-setting__text"><span class="ds-setting__title">背景を動かす</span><span class="ds-setting__desc">粒の背景を動かす。止めると電池の減りと、目の疲れを抑えられる。</span></div>
          <div class="ds-setting__control"><label class="ds-toggle"><input type="checkbox" id="stage-motion" aria-label="背景を動かす"></label></div>
        </div>
        <div class="ds-setting">
          <div class="ds-setting__text"><span class="ds-setting__title">効果音</span><span class="ds-setting__desc">判定の正解・不正解で音を鳴らす。</span></div>
          <div class="ds-setting__control"><label class="ds-toggle"><input type="checkbox" aria-label="効果音"></label></div>
        </div>
      </div>
    </div>
    <div class="ds-modal__footer">
      <button class="ds-btn ds-btn--primary" value="ok">閉じる</button>
    </div>
  </form>
</dialog>

<script>
  // 見本の動き（ゲームの本実装ではない）
  window.addEventListener('DOMContentLoaded', () => {
    const stage = document.getElementById('stage');
    // 始める: 札と背景が去ってから、作業の画面へ移る
    const go = href => {
      const card = stage.querySelector('.ds-stage__card');
      const out = { duration: ds.ms('--ds-motion-duration-slow'), easing: ds.ease('--ds-motion-ease-exit'), fill: 'forwards' };
      ds.play(stage.querySelector('.ds-stage__canvas'), [{ opacity: 1 }, { opacity: 0 }], out);
      ds.play(card, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-8px) scale(0.97)' }], out)
        .done.then(() => { location.href = href; });
    };
    document.getElementById('start').addEventListener('click', () => go('例_作業台画面.html'));
    document.getElementById('resume').addEventListener('click', () => go('例_作業台画面.html'));
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.target.closest('input, textarea, button, a, summary, dialog')) return;
      document.getElementById('start').click();
    });
    // 設定: 背景を動かすか
    const motion = document.getElementById('stage-motion');
    motion.checked = ds.stage.motion();
    motion.addEventListener('change', () => ds.stage.setMotion(motion.checked));
  });
</script>
</body>
</html>
