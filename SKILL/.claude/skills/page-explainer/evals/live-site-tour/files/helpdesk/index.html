<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>問い合わせ一覧 | 社内ヘルプデスク</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>社内ヘルプデスク</strong><a href="index.html">一覧</a><a id="new-link" href="new.html">新規作成</a></header>
<main><section><h1>問い合わせ一覧</h1>
<form id="search" action="index.html" method="get"><label for="q">言葉で探す</label> <input id="q" name="q" placeholder="例：プリンター"> <button type="submit">検索</button></form></section>
<section><h2 id="list-title">問い合わせ（<span id="count">0</span> 件）</h2><ul id="list"></ul></section></main>
<script>
const items=[{id:101,title:'プリンターが印刷できない',state:'対応中'},{id:102,title:'パスワードを忘れた',state:'受付'},{id:103,title:'プリンターのトナーを交換したい',state:'完了'},{id:104,title:'会議室のモニターが映らない',state:'受付'}];
const q=new URLSearchParams(location.search).get('q')||'';document.getElementById('q').value=q;
const shown=items.filter(x=>!q||x.title.includes(q));document.getElementById('count').textContent=shown.length;
document.getElementById('list').innerHTML=shown.map(x=>`<li><a href="ticket.html?id=${x.id}">${x.title}</a><span class="badge">${x.state}</span></li>`).join('');
</script></body></html>
