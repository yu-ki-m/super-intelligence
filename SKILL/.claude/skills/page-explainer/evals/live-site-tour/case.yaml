schema_version: "1.1"
name: live-site-tour
expected_outcome: |
  helpdesk のサイト（file:// の URL で開く 3 ページ）を、ページを移りながら操作して解説する案内の台本ができている。
  台本は、最初に開く URL と、手順ごとに、その手順を出す前に行う操作（入力・クリック・ページの移動）と、読み手に見せる操作の説明を持ち、
  一覧の検索 → 検索した結果 → 1 件の詳細 → 新規作成の画面の順に、画面をまたいで部分を指して説明する。
  コメントの送信と下書き保存は行わず、押すと何が起きるかを文で説明する。
  サイトの HTML ファイルは書き換えていない。案内は、見えないブラウザーで操作を行いながら最後の手順まで出せる。
  返答では、案内を開くコマンドと、案内が自動で行う操作、行わなかった操作を伝えている。
context:
  scaffold_script: place-files.sh
