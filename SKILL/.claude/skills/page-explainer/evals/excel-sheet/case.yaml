schema_version: "1.1"
name: excel-sheet
expected_outcome: |
  備品管理表.html に、画面の部品を順に枠で囲んで指し、吹き出しで説明する案内が付いている。
  Excel を知っている読み手に向けて、Excel と同じ所は短く、このページ特有の所（数式バーと再計算、編集の保存先、「AIに渡す」）を詳しく説明する。
  画面で直した内容が Claude Code に渡って作り直されるまでの流れを、なぜそうするのか（画面で直した内容はファイルに書き込まれない、など）を含めて、順に説明している。
  案内を開いている間に押したキーは、表のセルの選択や編集に影響しない。案内を閉じれば、表は元どおりに操作できる。
  各手順は、部品が何かを述べる1〜2文から始まり、具体例があり、「分からない」で1段細かい説明に切り替えられる。
context:
  scaffold_script: place-files.sh
