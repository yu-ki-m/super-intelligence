schema_version: "1.1"
name: deepen-step
expected_outcome: |
  経費精算の承認.html に付いている案内の、手順「「承認」「差し戻し」「却下」のボタン」（id: decision）に、前より細かい説明が足されている。
  足した説明は、前の説明の言い換えではなく、前の説明に無かった前提・途中の理由・判断の目安を含む。
  差し戻しは申請が申請者に戻り、申請者が直して出し直せること、却下は申請がそこで終わり出し直せないことを、ページの内容（判断の目安の欄と、ボタンを押したときの知らせ）と矛盾なく説明し、
  書類の不足のように申請者が直せる問題なら差し戻し、規程で精算できない経費なら却下、という選び方を示す。
  田中さんの申請（領収書なし）を例に、差し戻しを選ぶことと、その理由を説明する。
  ほかの手順の説明は変えていない。案内はブラウザーで動く。返答でも、どちらを押すかとその理由を答えている。
context:
  scaffold_script: place-files.sh
