schema_version: "1.1"
name: report-reading
expected_outcome: |
  good-report-jev.html（ある製品のローンチを分析したレポート）に、ページの部分を1つずつ枠で囲んで指し、吹き出しで解説する案内が付いている。
  案内は、レポート全体が何についての文書で、結論がどこにあり、どの順に読むとよいかの説明から始まり、
  読むための前提・根拠の強さのラベル・全体像・各章の主張と、それを支える表を、理解を積み上げる順に指す。
  各手順は、指した部分が何で何を示すかを述べる1〜2文から始まり、残りの説明は「詳細」で開く。
  レポートの専門用語は、このレポートでの意味を説明してから使い、「分からない」で1段細かい説明に切り替えられる。
  元のページの行は書き換えられておらず、案内を外せば元のファイルに戻る。狭い画面でも、案内を開くボタンと吹き出しが見えている範囲に収まる。
context:
  scaffold_script: place-files.sh
