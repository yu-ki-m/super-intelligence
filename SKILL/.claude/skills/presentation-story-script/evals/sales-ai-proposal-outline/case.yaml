schema_version: "1.1"
name: sales-ai-proposal-outline
expected_outcome: |
  提案の型で、10分の提案の骨子だけを作り、台本は書かずに利用者の確認を求める。
  骨子（変化の一文、展開、ネタの候補、問いと答え）をMarkdownとHTMLに書く。
  最初に決めてほしいこと（3か月の試行の承認）を言い、何もしない場合を含めて比べ、
  本部長の懸念（現場が使わない）を扱い、funnyは控えめにする。
  「1件30分くらい」は集計前の感触として扱い、確かめてほしいことに入れる。
  展開には、段階ごとに前の段階からのつなぎを書く。
