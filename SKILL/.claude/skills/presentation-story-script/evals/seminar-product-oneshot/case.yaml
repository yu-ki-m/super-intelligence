schema_version: "1.1"
name: seminar-product-oneshot
expected_outcome: |
  紹介の型で、20分のセミナーのストーリー設計と台本を、確認の質問をせずに一度で作る。
  変化の一文、展開（funnyとinterestingの置き場所）、ネタ、問いと答え、台本、確かめてほしいことを
  Markdownに書き、同じ名前のHTMLも作る。
  製品資料の数字は条件と一緒に使い、資料にない数字や事例は【仮】と書く。
  掴みは聞き手（経理担当）の経験から始め、原因の見直しを山にし、
  最後に冒頭を回収して無料トライアルの申し込みを一つだけ頼む。
  テーマを切り替える所では黙って切り替えず、前の話を受けてから次の話に移る。
context:
  scaffold_script: place-files.sh
