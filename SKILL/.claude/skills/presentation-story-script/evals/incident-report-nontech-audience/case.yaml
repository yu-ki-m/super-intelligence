schema_version: "1.1"
name: incident-report-nontech-audience
expected_outcome: |
  報告の型で、エンジニアではない聞き手に向けた10分の障害報告のストーリー設計と台本を、
  確認の質問をせずに一度で作り、MarkdownとHTMLに書く。
  依頼文にある開発の用語（マイグレーション、インデックス、ロック、接続プール、ロールバック、
  ステージング、カナリアリリース）と社内の呼び名（ハコブネ）を、説明なしで台本に移さない。
  使うなら初めて出る所で、その報告の中で何を指すのかを聞き手に分かる言葉で言う。
  再発防止策が同じ障害をなぜ防げるのか、火曜の朝を避けてほしいのはなぜかという仕組みも、
  聞き手が知っている言葉で言う。
  影響と謝罪を先に言い、影響を受けた人を笑わない。
