schema_version: "1.1"
name: lt-share-oneshot
expected_outcome: |
  知見の共有の型で、5分のLTのストーリー設計と台本を一度で作り、MarkdownとHTMLに書く。
  掴みは意外な結果か問いで始め、話し手の失敗談（呼び出しに40分気づかなかった）を
  つまずきとして使い、そこから分かったやり方につなげる。
  台本の長さは5分に収まり、持ち帰ってほしいことを一つに絞り、最後に冒頭を回収する。
  依頼文にない数字や工夫は【仮】と書き、オンラインの聞き手にも配慮する。
  テーマを切り替える所では黙って切り替えず、前の話を受けてから次の話に移る。
