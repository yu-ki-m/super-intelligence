name: improve-note-cleaner-copy-only
expected_outcome: |
  入力の note-cleaner は書き換えられず、直した写しが渡される。写しでは、元のメモを確認なしに上書きしない（確認か控えを取る）、
  TODO などの行を黙って消さない、フォルダやファイルが無いときの扱い、何を変えたかの報告、が手順に入っている。
